services:
  # 1. FastAPI Python Web Service (Backend)
  - type: web
    name: synopsis-backend
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: "pip install -r server/requirements.txt"
    startCommand: "uvicorn server.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

  # 2. React Vite Single Page App (Frontend)
  - type: static
    name: synopsis-frontend
    plan: free
    region: oregon
    branch: main
    buildCommand: "npm --prefix client install && npm --prefix client run build"
    staticPublishPath: client/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
